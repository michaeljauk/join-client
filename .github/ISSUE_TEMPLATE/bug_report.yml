name: Bug report
description: Something in the SDK, CLI or MCP server is broken
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - join-sdk
        - join-com-cli
        - join-mcp
        - several / unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pnpm why join-sdk` or `join-com --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "22.x"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or a code snippet. If this hits the JOIN API, redact tokens and candidate data.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: text
